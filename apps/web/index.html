<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8fafc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <meta name="theme-color" content="#1e6ff5" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="Botara — Omnichannel Chatbot Platform" />
    <meta property="og:description" content="Botara is the open-source omnichannel chatbot platform — WhatsApp, Messenger, Instagram, Threads, Telegram and webchat in one inbox, with flows, broadcasts and AI." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:type" content="website" />
    <title>Botara — Omnichannel Chatbot Platform</title>
    <script>
      // Pre-paint bootstrap: apply the persisted theme class + language
      // before first render to avoid a light flash for dark-mode users.
      (function () {
        try {
          var theme = localStorage.getItem("botara.theme");
          if (!theme) {
            theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          if (theme === "dark") document.documentElement.classList.add("dark");
          var lang = localStorage.getItem("botara.lang");
          if (lang === "en" || lang === "id") document.documentElement.lang = lang;
        } catch (e) { /* storage unavailable - defaults apply */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
