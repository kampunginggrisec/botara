name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck (all workspaces)
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build web
        run: bun run build

      # Non-blocking: surfaces Meta deprecations that are past due or land
      # within 90 days on every run without freezing unrelated work.
      # Details: scripts/check-deprecations.ts + docs/runbook.md.
      - name: Deprecation guard (warning only)
        continue-on-error: true
        run: bun scripts/check-deprecations.ts
