services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: botara
      POSTGRES_PASSWORD: botara
      POSTGRES_DB: botara
    ports:
      - "5432:5432"
    volumes:
      - botara-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botara -d botara"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - botara-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  botara-postgres-data:
  botara-redis-data:
