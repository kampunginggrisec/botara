# Botara - PRODUCTION compose.
# Usage (on the VPS):
#   cp .env.production.example .env.production   # fill in real values
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.production up -d --build
# Only the Caddy proxy publishes ports (80/443). Postgres is bound to
# localhost only; Redis is internal-only. Full guide: docs/deploy/vps.md

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: botara
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: botara
    ports:
      # Localhost only - never expose Postgres publicly.
      - "127.0.0.1:5432:5432"
    volumes:
      - botara-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botara -d botara"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - botara-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api
    restart: unless-stopped
    env_file:
      - ../../.env.production
    environment:
      PORT_API: "3000"
      DATABASE_URL: postgres://botara:${POSTGRES_PASSWORD}@postgres:5432/botara
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    env_file:
      - ../../.env.production
    environment:
      DATABASE_URL: postgres://botara:${POSTGRES_PASSWORD}@postgres:5432/botara
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  realtime:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: realtime
    restart: unless-stopped
    env_file:
      - ../../.env.production
    environment:
      PORT_REALTIME: "3002"
      REDIS_URL: redis://redis:6379
      # Direct API address for /auth/me workspace resolution (no /api
      # prefix). SESSION_SECRET arrives via the env_file above and must
      # match the API's - realtime verifies the same session JWTs.
      BOTARA_API_URL: http://api:3000

  web:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped

  # Optional MCP server (docs/mcp.md). Start with:
  #   docker compose ... --profile mcp up -d mcp
  # It talks to the API over the internal network with ONE user's API
  # token (BOTARA_API_TOKEN in .env.production) and binds localhost only -
  # put your own TLS/auth proxy in front before exposing it further.
  mcp:
    profiles: ["mcp"]
    build:
      context: ../..
      dockerfile: Dockerfile
      target: mcp
    restart: unless-stopped
    env_file:
      - ../../.env.production
    environment:
      PORT_MCP: "3003"
      # Direct to the API container (the API serves its routes at root;
      # the /api prefix exists only on the public Caddy route).
      BOTARA_API_URL: http://api:3000
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - botara-caddy-data:/data
      - botara-caddy-config:/config
    depends_on:
      - api
      - realtime
      - web

volumes:
  botara-postgres-data:
  botara-redis-data:
  botara-caddy-data:
  botara-caddy-config:
